# Copy to .local/runtime.yaml; keep actual signing/encryption keys out of Git.
server:
  host: "127.0.0.1"
  port: 8772
  cors_origins: "https://d.58nft.net:9450"
database:
  type: "sqlite"
  sqlite_path: "./data/spider_xhs.db"
security:
  secret_key: "REPLACE_WITH_RANDOM_SECRET"
  fernet_key: "REPLACE_WITH_FERNET_KEY"
scheduler:
  enabled: true
  interval_seconds: 60
frontend:
  serve_static: true
  build_dir: "./frontend/dist"
xhs_network:
  mode: home
  proxy_url: "socks5h://127.0.0.1:18890"
  label: "家庭网络 · Mac mini"
  # Empty only after the authorized_keys entry has been made persistent.
  authorization_expires_at: ""
