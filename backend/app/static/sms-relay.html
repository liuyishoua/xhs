<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>手机短信转发配置</title><style>body{font:17px system-ui;max-width:640px;margin:32px auto;padding:20px;background:#f6f8fa;color:#17212b}input,button{font:inherit;padding:12px;box-sizing:border-box;width:100%;margin:8px 0}section{background:white;padding:24px;border-radius:14px;margin:16px 0}label{display:block;margin-top:14px}#error{color:#b3261e}small{color:#555}</style>
<h2>手机短信转发配置</h2><section id="login"><p>使用小红书工作台的账号登录。</p><input id="username" placeholder="工作台用户名" autocomplete="username"><input id="password" type="password" placeholder="工作台密码" autocomplete="current-password"><button id="signin">登录并查看配置</button></section>
<section id="config" hidden><p>手机 → 发送通道 → 新增 → Webhook</p><label>请求方式<input value="POST" readonly></label><label>WebServer / 请求地址<input id="url" readonly></label><button id="copyurl">复制地址</button><label>Secret / 密钥<input id="secret" type="password" readonly></label><button id="copysecret">复制密钥</button><label>WebParams / 请求参数<input value="留空" readonly></label><p>消息模板先用默认值。保存后，点击测试发送。</p><button id="reload">检查服务器是否收到测试</button><p id="state"></p><small>当前支持转交本工作台已发起的小红书短信登录。没有待登录任务时，收到的验证码不会触发登录。</small></section><p id="error"></p>
<section id="senders" hidden><h3>小红书短信发送号码</h3><p>如果正文没有“小红书”，填入你刚收到的小红书登录短信的实际发送号码或名称。每行一个，按完整值匹配。</p><textarea id="senderlist" rows="3" style="width:100%;font:inherit;box-sizing:border-box"></textarea><button id="savesenders">保存发送号码</button></section>
<script>
let access='';const el=id=>document.getElementById(id);
async function call(path,data,method){const r=await fetch('/api'+path,{method:method||(data?'POST':'GET'),headers:{'Content-Type':'application/json',...(access?{Authorization:'Bearer '+access}:{})},...(data?{body:JSON.stringify(data)}:{})});if(!r.ok)throw Error(r.status===401?'请先登录工作台账号':'请求未完成，请重试');return r.json()}
async function load(){const d=await call('/sms-relay/settings');el('url').value=d.url;el('secret').value=d.secret;el('login').hidden=true;el('config').hidden=false;const names={received_test_or_ignored:'已收到测试或无需处理的短信',no_pending_login:'已收到短信，当前没有等待验证码的登录任务',processing:'正在确认登录',confirmed:'登录已恢复',needs_attention:'需要在工作台检查登录验证'};el('state').textContent=d.last_received?(names[d.last_state]||d.last_state)+' · '+new Date(d.last_received*1000).toLocaleString():'尚未收到手机发送的测试';}
async function run(fn){el('error').textContent='';try{await fn()}catch(e){el('error').textContent=e.message}}
const originalLoad=load;load=async()=>{await originalLoad();const d=await call('/sms-relay/settings');el('senders').hidden=false;el('senderlist').value=d.xhs_senders.join('\n')};
el('savesenders').onclick=()=>run(async()=>{await call('/sms-relay/settings',{xhs_senders:el('senderlist').value.split('\n').map(s=>s.trim()).filter(Boolean)},'PUT');el('state').textContent='发送号码已保存'});
el('signin').onclick=()=>run(async()=>{const d=await call('/auth/login',{username:el('username').value,password:el('password').value});access=d.access_token;el('username').value='';el('password').value='';await load()});el('reload').onclick=()=>run(load);el('copyurl').onclick=()=>run(()=>navigator.clipboard.writeText(el('url').value));el('copysecret').onclick=()=>run(()=>navigator.clipboard.writeText(el('secret').value));
run(async()=>{const refresh=localStorage.getItem('spider_xhs_refresh_token');if(refresh){const d=await call('/auth/refresh',{refresh_token:refresh});access=d.access_token;await load()}});
</script></html>
